<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f0b" />
    <meta name="description" content="TKCom, an offline-first browser tactical strategy game." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./pwa.svg" />
    <title>TKCom Tactical Strategy Game</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0f0b;
        color: #8f8;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #game-mount {
        position: fixed;
        inset: 0;
      }
      #hud {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 10;
        font-size: 12px;
        line-height: 1.5;
        text-shadow: 0 1px 2px #000;
      }
      button {
        margin-left: 8px;
        padding: 4px 8px;
        border: 1px solid #8f8;
        background: #102010;
        color: #8f8;
        font: inherit;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      #campaign {
        position: fixed;
        inset: 0;
        overflow: auto;
        padding: 24px;
        background: #0b0f0b;
      }
      #campaign h1 {
        font-size: 18px;
        margin-bottom: 4px;
      }
      .card {
        max-width: 560px;
        margin: 0 auto;
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin: 12px 0;
        font-size: 13px;
      }
      .panel {
        border: 1px solid #2c3a2c;
        border-radius: 4px;
        padding: 10px 12px;
        margin: 12px 0;
      }
      .panel h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #6a9a6a;
        margin-bottom: 8px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 3px 0;
        font-size: 13px;
      }
      .row button {
        margin-left: 0;
      }
      .muted {
        color: #5a6a5a;
      }
      .dead {
        color: #b05050;
      }
      .recovering {
        color: #b0a050;
      }
      #campaign-msg {
        min-height: 18px;
        font-size: 13px;
        color: #aef0ae;
      }
      .primary {
        border-color: #aef0ae;
        color: #dfffdf;
      }
    </style>
  </head>
  <body>
    <div id="game-mount"></div>
    <div id="hud" hidden>
      TKCom
      <span id="hud-status"></span>
      <button id="end-turn" type="button">end turn</button>
      <button id="abort" type="button">abort</button>
    </div>

    <div id="campaign"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
